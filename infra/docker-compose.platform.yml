version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skua
      POSTGRES_PASSWORD: skua
      POSTGRES_DB: skua
    ports:
      - "5432:5432"
    volumes:
      - skua-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: skua
      MINIO_ROOT_PASSWORD: skua12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - skua-minio:/data

volumes:
  skua-postgres:
  skua-minio:
