version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file:
      - ./staging.env.example
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      SKUA_API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    env_file:
      - ./staging.env.example

  redis:
    image: redis:7

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - ./staging.env.example

