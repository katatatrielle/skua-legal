id: commercial-house-standard
name: Commercial House Standard
version: "0.1"
description: Buyer-side commercial baseline for Ontario-focused vendor and customer paper.
comparison_mode: house_standard
required_clauses:
  - id: assignment-affiliate
    label: Affiliate transfer carve-out
    severity: high
    preferred_fix_mode: replace_selection
    contract_types: [customer_agreement, vendor_agreement, saas]
    guidance: Preserve a consent right but carve out internal reorganizations and affiliate transfers.
    required_terms:
      - affiliate
      - assign
    recommended_fix: Neither party may assign this Agreement without prior written consent, except to an affiliate or in connection with a merger, reorganization, or sale of substantially all assets.
  - id: governing-law-ontario
    label: Ontario governing law position
    severity: medium
    preferred_fix_mode: replace_selection
    contract_types: [customer_agreement, vendor_agreement, nda, saas]
    guidance: Default the commercial paper to Ontario law and Toronto forum unless deal context requires otherwise.
    required_terms:
      - ontario
      - governing law
    recommended_fix: This Agreement will be governed by the laws of Ontario and the federal laws of Canada applicable therein, and the parties attorn to the courts located in Toronto, Ontario.
  - id: data-localization
    label: Data localization fallback
    severity: medium
    preferred_fix_mode: insert_after_selection
    contract_types: [vendor_agreement, saas]
    guidance: Where customer or regulated data is involved, include a Canada-based hosting fallback or approval right.
    required_terms:
      - canada
      - data
    recommended_fix: Customer Data must be stored and processed in Canada, or in another location approved in writing by Customer, with equivalent security and privacy safeguards.
  - id: limitation-cap
    label: Liability cap structure
    severity: medium
    preferred_fix_mode: replace_selection
    contract_types: [customer_agreement, vendor_agreement, saas]
    guidance: Cap direct damages while preserving carve-outs for excluded claims such as confidentiality, IP misuse, and gross negligence.
    required_terms:
      - liability
      - cap
    recommended_fix: Except for excluded claims, each party's aggregate liability under this Agreement will not exceed the fees paid or payable in the 12 months preceding the claim.
