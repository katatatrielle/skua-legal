id: vendor-paper-tightened
name: Vendor Paper Tightened
version: "0.1"
description: More defensive buyer-side standard for incoming vendor and SaaS paper.
comparison_mode: house_standard
required_clauses:
  - id: assignment-affiliate
    label: Affiliate transfer carve-out
    severity: high
    preferred_fix_mode: replace_selection
    contract_types: [vendor_agreement, saas]
    guidance: Retain anti-assignment language while allowing internal restructurings and affiliate transfers.
    required_terms:
      - affiliate
      - assign
    recommended_fix: Neither party may assign this Agreement without prior written consent, except to an affiliate or in connection with a merger, reorganization, or sale of substantially all assets.
  - id: data-localization
    label: Canada data residency fallback
    severity: high
    preferred_fix_mode: insert_after_selection
    contract_types: [vendor_agreement, saas]
    guidance: Vendor paper should include an explicit Canada-hosting fallback or customer approval gate.
    required_terms:
      - canada
      - data
      - customer
    recommended_fix: Vendor will store and process Customer Data in Canada unless Customer approves another jurisdiction in writing.
  - id: security-notice
    label: Security incident notice
    severity: high
    preferred_fix_mode: insert_after_selection
    contract_types: [vendor_agreement, saas]
    guidance: Require prompt vendor notice of incidents affecting customer systems or data.
    required_terms:
      - security incident
      - notice
    recommended_fix: Vendor will notify Customer without undue delay, and in any event within 24 hours, after becoming aware of any Security Incident affecting Customer Data or Customer systems.
  - id: termination-assistance
    label: Termination assistance
    severity: medium
    preferred_fix_mode: insert_after_selection
    contract_types: [vendor_agreement, saas]
    guidance: SaaS and outsourcing arrangements should include an exit and cooperation obligation.
    required_terms:
      - termination
      - assistance
    recommended_fix: On termination or expiry, Vendor will provide reasonable transition assistance and return or securely destroy Customer Data as directed by Customer.
