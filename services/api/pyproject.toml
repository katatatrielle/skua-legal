[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skua-api"
version = "0.1.0"
description = "FastAPI orchestration service for the Skua contract copilot"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "boto3>=1.34,<2.0",
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pypdf>=5.4,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyJWT>=2.9,<3.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "redis>=5.0,<6.0",
  "rq>=1.16,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "structlog>=24.0,<25.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
