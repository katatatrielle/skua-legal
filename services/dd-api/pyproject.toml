[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skua-dd-api"
version = "0.1.0"
description = "FastAPI orchestration service for Skua Legal due diligence workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pypdf>=5.4,<6.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
